name: TezAtlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testler, lint ve bağlantı denetimi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Paketi kur
        run: pip install -e ".[all]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Testler
        run: pytest -q
        env:
          # CI'da gerçek anahtar yok; testler sahte istemci kullanır
          OPENROUTER_API_KEY: "ci-test-key"
          GEMINI_API_KEY: "ci-test-key"
          DEEPSEEK_API_KEY: "ci-test-key"

      - name: Skill bağlantı denetimi
        run: python3 scripts/check_links.py

      - name: agents.yaml doğrulama
        run: |
          python3 -c "
          import yaml
          cfg = yaml.safe_load(open('agents.yaml'))
          for k in ('providers', 'agents', 'defaults'):
              assert k in cfg, k + ' bölümü yok'
          for name, agent in cfg['agents'].items():
              assert 'provider' in agent, name + ': provider yok'
              assert agent['provider'] in cfg['providers'], name + ': bilinmeyen provider'
          print('agents.yaml: OK')
          "
